name = "semigroupbetti"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SemigroupBetti", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "5ed2965256"

[[lean_lib]]
name = "SemigroupBetti"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
