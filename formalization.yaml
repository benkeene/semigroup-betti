# formalization.yaml — adopted from https://github.com/mathlib-initiative/formalization.yaml
version: "v0.4"

project:
  name: "A sharp linear bound for the first Betti number of four-generated numerical semigroups"
  description: >-
    A Lean 4 formalization, against Mathlib, of the theorem that the first Betti number
    (minimal number of generators of the toric ideal) of a numerical semigroup minimally
    generated by four elements n0 < n1 < n2 < n3 is at most 2W, where
    W = (n3 - n0) / gcd(n1 - n0, n2 - n0, n3 - n0); in particular at most twice the width
    n3 - n0.  This replaces the conjectured quadratic bound (w+1 choose 2) of Herzog–Stamate
    (2014) and Caviglia–Moscariello–Sammartano (2024) in embedding dimension four; the bound
    2w is attained for every width w >= 4.
  authors:
    - "Ben Keene"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Ben Keene"

repository:
  role: substantive-development

classification:
  arxiv: [math.AC, math.CO]
  msc2020: ["13D02", "20M14", "13F65", "05E40"]

status:
  scope: >-
    COMPLETE (2026-10-07).  Both theorems of record are proved in Solution.lean by thin bridges
    into the development library SemigroupBetti/ (2,432 lines): the combinatorial invariant
    beta1 (fiber graphs of factorizations in N^4), the bound beta1 <= 2W (Lemmas 1-16 of the
    informal write-up), and the bridge spanRank(toric ideal) <= beta1.  The only two sorrys in
    the repository are the deliberate holes in Challenge.lean (Comparator convention); both
    compared theorems depend on exactly propext, Classical.choice and Quot.sound.  Built on
    2026-10-07 with `lake build` on Lean v4.34.0 / Mathlib 5ed2965256 (8940 jobs, log in
    lake_build.log).
  sorry_count: 2
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - "SemigroupBetti.beta1_le_two_mul_normalizedWidth"
    - "SemigroupBetti.beta1_le_two_mul_width"

fidelity:
  divergences: >-
    The informal theorem is stated for the cardinality of a minimal presentation of the
    semigroup; the formal statement bounds Submodule.spanRank of the toric ideal
    ker(K[X0..X3] -> K[t], Xi |-> t^(n i)), which equals the minimal number of generators of
    the ideal.  Minimal generation of the semigroup is stated as: no n i lies in the additive
    submonoid generated by the other three.  Sharpness (the bound is attained) is not part of
    the formal statement.

sources:
  - title: "beta_1 <= 2W for four-generated numerical semigroups (claim_0003)"
    authors: ["Ben Keene (principal); proofs produced with GPT-6 Astra (OpenAI) and Claude (Anthropic)"]
    type: "manuscript"
    id: "aiseminar repository, agents/shared/claim_0003 (PROOF_B_combinatorial.md, PROOF_B_lean_writeup.md)"
    relationship: formalizes
    note: >-
      The combinatorial proof (support counting on factorization graphs) is the one formalized.
      A second, independent proof via Minkowski's second theorem and a complete intersection
      (PROOF.md) is not formalized.
  - title: "Bounds for syzygies of monomial curves"
    authors: ["Giulio Caviglia", "Alessio Moscariello", "Alessio Sammartano"]
    type: "article"
    id: "https://doi.org/10.1090/proc/16862"
    relationship: background
    note: "Conjecture 1.3 (the quadratic width bound) and Theorem 1.5 (embedding dimension four, width >= 40)."
  - title: "On the defining equations of the tangent cone of a numerical semigroup ring"
    authors: ["Jürgen Herzog", "Dumitru I. Stamate"]
    type: "article"
    id: "https://doi.org/10.1016/j.jalgebra.2014.07.008"
    relationship: background
    note: "Conjecture 2.1, the origin of the width conjecture."

related_formalizations: []

automation:
  methods:
    - method: agent
      models: ["Claude Fable 5.1 (Anthropic)", "Claude Opus 5.5 (Anthropic)", "GPT-6 Astra (OpenAI)"]
      framework: "Claude Code; Codex app-server (for GPT-6 Astra)"
      role: >-
        The informal proofs were found by GPT-6 Astra acting as an independent prover, reviewed
        adversarially by further Astra runs, and checked line by line by Claude; the explicit
        Lean-oriented write-up was produced by Astra.  The Lean source is written by Claude
        (Fable 5.1 directing, Opus 5.5 coding agents) in Claude Code under the direction and
        review of the author, who selected the target, made the mathematical decisions and
        audited the Challenge statements against the informal theorem.

review:
  status: self-assessed
  reviewers:
    - "Ben Keene"
  notes: >-
    The informal proof passed two independent adversarial reviews and one reviewer pass
    (GPT-6 Astra) and exhaustive computational checks for all widths <= 39.  No external human
    review has been performed.  Every formal step is checked by Lean.

known_gaps: []

limitations:
  - >-
    The mathematical result is new (no prior statement located in the literature as of
    2026-10-06); novelty is asserted on the basis of literature audits, not of publication.
  - >-
    Sharpness of the bound is established informally only.
  - >-
    The reverse bridge inequality (the combinatorial invariant is at most spanRank, hence equal
    to it) is not formalized; it is not needed for the statements of record.

alignment:
  namespace: "SemigroupBetti"
  statements:
    - source: "Main theorem: beta_1(S) <= 2W for every minimally four-generated numerical semigroup"
      lean: "SemigroupBetti.beta1_le_two_mul_normalizedWidth"
      module: "Challenge (statement), Solution (proof)"
      status: proved
      note: >-
        The formal statement bounds Submodule.spanRank of the toric ideal; the informal theorem
        bounds the cardinality of a minimal presentation.  Only the inequality spanRank <= beta1
        is formalized (the bridge Lemma 0 in the direction needed); the equality mu(I) = beta1 is
        informal only.
    - source: "Corollary: beta_1(S) <= 2 wd(S)"
      lean: "SemigroupBetti.beta1_le_two_mul_width"
      module: "Challenge (statement), Solution (proof)"
      status: proved
